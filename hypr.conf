# Common Hyprland settings
# The wallpaper is started from hyprland.conf, not here: having the line in
# both files ran wallpaper.sh init twice and raced two hyprpaper instances.
# eww daemon for the popup panels (wifi/bluetooth/power/volume/calendar)
exec-once = eww -c ~/.config/hypr/apps/eww daemon
# Spotify dropdown daemon (waybar now-playing module clicks toggle it over IPC).
exec-once = qs -p ~/.config/hypr/apps/quickshell/spotify -n
# App launcher daemon (SUPER+R / SUPER+Space / the waybar ⌖ module toggle it).
exec-once = qs -p ~/.config/hypr/apps/quickshell/launcher -n
# Control centre + its top-right hot corner.
exec-once = qs -p ~/.config/hypr/apps/quickshell/controlcenter -n
# Keybinding cheat sheet (SUPER+I).
exec-once = qs -p ~/.config/hypr/apps/quickshell/keybinds -n


# Monitor setup (explicit output name + 1.0 scale)
# Replace `eDP-1` with your output if different (check `hyprctl -j monitors`).
monitor = eDP-1,preferred,auto,1.0

# Persistent workspaces 1-9; 10+ are created on demand. See workspaces.conf.
source = ./workspaces.conf
gesture = 3, horizontal, workspace
# 4-finger swipe up: open the hidden workspace, only from workspace 1.
# 4-finger swipe down: close it again (always allowed).
gesture = 4, up, dispatcher, exec, ~/.config/hypr/scripts/hidden-workspace-open.sh
gesture = 4, down, dispatcher, exec, ~/.config/hypr/scripts/hidden-workspace-close.sh

# Hair-trigger workspace swipe: a short flick commits instead of requiring a
# full edge-to-edge drag.
#   distance            - px of travel that equals one whole workspace
#   cancel_ratio        - fraction of that distance you must pass to commit;
#                         below it the swipe snaps back
#   min_speed_to_force  - flick speed that switches regardless of distance
gestures {
  workspace_swipe_distance = 120
  workspace_swipe_cancel_ratio = 0.15
  workspace_swipe_min_speed_to_force = 5
  workspace_swipe_direction_lock = false
  # Swiping right off the last workspace brings a new one into existence.
  workspace_swipe_create_new = true
}
bind = SUPER CTRL SHIFT, up, exec, ~/.config/hypr/scripts/hidden-workspace-open.sh
bind = SUPER CTRL SHIFT, down, exec, ~/.config/hypr/scripts/hidden-workspace-close.sh

# Application shortcuts
$term = kitty
$menu = ~/.config/hypr/scripts/app-launcher.sh

bind = SUPER, T, exec, kitty
bind = SUPER, Return, exec, kitty
bind = SUPER, C, exec, code
bind = SUPER, W, exec, firefox
bind = SUPER, E, exec, nautilus
bind = SUPER SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-selector.sh
bind = SUPER CTRL SHIFT, W, exec, ~/.config/hypr/scripts/lockscreen-wallpaper-selector.sh
bind = SUPER, R, exec, $menu
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, Space, exec, $menu
bind = , XF86PowerOff, exec, ~/.config/hypr/scripts/power-menu.sh menu
bind = SUPER, S, exec, spotify
# Keybinding cheat sheet — every bind in this config, read live from it.
bind = SUPER, I, exec, ~/.config/hypr/scripts/qs-toggle.sh keybinds keybinds


bind = SUPER, L, exec, hyprlock

# Cycle CPU power mode: normal → performance → battery → normal
# The waybar battery glyph shows which one is active
# (red = performance, green = battery saver, white = balanced).
bind = SUPER, P, exec, ~/.config/hypr/apps/waybar/scripts/performance-mode.sh toggle

# Screenshots
# Print        → full screen (no area picker)
# Shift+Print  → select a region
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh full
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh selection

# Notification controls (mako)
bind = SUPER, N, exec, makoctl dismiss
bind = SUPER SHIFT, N, exec, makoctl dismiss --all
bind = SUPER CTRL, N, exec, makoctl mode -t do-not-disturb

# Brightness / volume / mute: Fn+media keys only (not bare F-keys)
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness-control.sh down
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness-control.sh up
# The wpctl -> pamixer -> pactl fallback chain, the 5% step and the 150%
# boost limit all live in lib/domain/audio.sh rather than being repeated
# across three bindings and the eww panel.
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume-control.sh down
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume-control.sh up
bindel = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume-control.sh mute

# Lid close → lock + blank panel. Logind must NOT suspend/hibernate
# (HandleLidSwitch=ignore via apps/systemd/10-lid-lock.conf).
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid-close.sh
# Lid open → revive the panel; keep / show the lock screen.
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/display-restore.sh

# Calendar submap: active only while the eww calendar panel is open.
# Left/Right change the month; Escape (or Enter) closes and leaves the map.
submap = calendar
bind = , left,  exec, ~/.config/hypr/scripts/eww-cal.sh prev
bind = , right, exec, ~/.config/hypr/scripts/eww-cal.sh next
bind = , escape, exec, eww -c ~/.config/hypr/apps/eww close calendar
bind = , escape, submap, reset
bind = , return, exec, eww -c ~/.config/hypr/apps/eww close calendar
bind = , return, submap, reset
submap = reset

# Basic workspace switching
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER CTRL SHIFT, 1, movetoworkspace, 1
bind = SUPER CTRL SHIFT, 2, movetoworkspace, 2
bind = SUPER CTRL SHIFT, 3, movetoworkspace, 3
bind = SUPER CTRL SHIFT, 4, movetoworkspace, 4
bind = SUPER CTRL SHIFT, 5, movetoworkspace, 5
bind = SUPER CTRL SHIFT, 6, movetoworkspace, 6
bind = SUPER CTRL SHIFT, 7, movetoworkspace, 7
bind = SUPER CTRL SHIFT, 8, movetoworkspace, 8
bind = SUPER CTRL SHIFT, 9, movetoworkspace, 9
bind = SUPER CTRL SHIFT, 0, movetoworkspace, 10
bind = SUPER, TAB, focuswindow, next
bind = SUPER SHIFT, TAB, focuswindow, previous
# Directional navigation uses +1/-1, not e+1/e-1: the `e` variants only cycle
# through workspaces that already exist and wrap 9 -> 1, so you could never
# reach a tenth. Plain +1 walks to the next number and creates it on arrival.
bind = SUPER, mouse_up, workspace, -1
bind = SUPER, mouse_down, workspace, +1
bind = SUPER CTRL, right, workspace, +1
bind = SUPER CTRL, left, workspace, -1
bind = SUPER CTRL SHIFT, R, exec, hyprctl reload && notify-send "✎﹏﹏﹏﹏"

# Smooth animations
animations {
  enabled = yes

  # Sonoma easing: decelerate into place, never overshoot. Durations are in
  # 10ms ticks, so 15-22 == the 150-220ms the design calls for.
  bezier = sonoma, 0.22, 1.0, 0.36, 1.0
  bezier = sonomaOut, 0.4, 0.0, 0.2, 1.0
  # Snappy workspace switch: fast out, quick settle.
  bezier = snap, 0.2, 0.9, 0.2, 1.0

  animation = windows, 1, 2, sonoma, popin 96%
  animation = windowsIn, 1, 2, sonoma, popin 96%
  animation = windowsOut, 1, 2, sonomaOut, popin 96%
  animation = windowsMove, 1, 2, sonoma
  animation = border, 1, 3, sonoma
  animation = borderangle, 1, 30, sonoma
  animation = fade, 1, 2, sonoma
  animation = fadeIn, 1, 2, sonoma
  animation = fadeOut, 1, 2, sonomaOut
  # Workspace switching: stock slide, short and snappy.
  animation = workspaces, 1, 3, snap, slide
  animation = specialWorkspace, 1, 3, snap, slidevert
  animation = layers, 1, 2, sonoma, fade
  animation = layersIn, 1, 2, sonoma, fade
  animation = layersOut, 1, 2, sonomaOut, fade
}

# Minimal, barely-there glass edges. gaps_out leaves room for the floating
# waybar island (which carries its own 4px top margin).
general {
  gaps_in = 5
  gaps_out = 4
  border_size = 1
  col.active_border = rgba(ffffff2e)
  col.inactive_border = rgba(ffffff14)
}

# Wayland and optional NVIDIA environment helpers
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Route Qt apps (Dolphin, etc.) through qt6ct so the pure-black PureBlack
# color scheme + translucent Kvantum theme (PureBlackGlass) apply.
# NOTE: AnyDesk inherits these and renders broken widgets (blank checkboxes/
# radios/buttons) since it doesn't expect Kvantum styling hooks. It has a
# ~/.local/share/applications/anydesk.desktop override that launches it via
# scripts/anydesk-launch.sh, which unsets these two vars just for AnyDesk.
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum

# Force dark GTK theme for nm-connection-editor, blueman-manager, etc.
env = GTK_THEME,Adwaita:dark

# macOS Sonoma glass. Deep, multi-pass blur is what separates real frosted
# glass from flat transparency — the panels themselves are only 60% opaque
# and rely on this to stay readable.
decoration {
  rounding = 18

  blur {
    enabled = true
    size = 10
    passes = 4
    new_optimizations = true
    xray = false
    ignore_opacity = true
    # Vibrancy: pull a little saturation and light out of what sits behind the
    # glass, the way macOS materials do.
    vibrancy = 0.20
    vibrancy_darkness = 0.25
    # A dark material darkens its backdrop before tinting it — without this the
    # wallpaper reads straight through the panel and white text loses contrast.
    brightness = 0.85
    contrast = 1.0
    # Fine grain. macOS materials are dithered; without it a 4-pass blur over a
    # smooth gradient bands visibly.
    noise = 0.02
  }

  # Soft shadow only, no hard outline.
  shadow {
    enabled = true
    range = 20
    render_power = 3
    color = rgba(00000055)
  }

  active_opacity = 0.97
  inactive_opacity = 0.92
}


# Layer blur. Hyprland 0.56 matches layer surfaces with `match:namespace` and
# wants an explicit value per field; the older `blurls = ...` keyword and the
# `layerrule { name = ... }` block form parse without an error but never match,
# so nothing was actually being blurred.
layerrule = match:namespace ^(waybar)$, blur true
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.2

layerrule = match:namespace ^(rofi)$, blur true
layerrule = match:namespace ^(rofi)$, ignore_alpha 0.2

# quickshell surfaces, named by WlrLayershell.namespace in their shell.qml.
#
# Their surfaces are fullscreen but fully transparent outside the card;
# ignore_alpha keeps the blur off those transparent pixels.
layerrule = match:namespace ^(hypr-spotify)$, blur true
layerrule = match:namespace ^(hypr-spotify)$, ignore_alpha 0.2

layerrule = match:namespace ^(hypr-launcher)$, blur true
layerrule = match:namespace ^(hypr-launcher)$, ignore_alpha 0.2

layerrule = match:namespace ^(hypr-controlcenter)$, blur true
layerrule = match:namespace ^(hypr-controlcenter)$, ignore_alpha 0.2

layerrule = match:namespace ^(hypr-keybinds)$, blur true
layerrule = match:namespace ^(hypr-keybinds)$, ignore_alpha 0.2


# Calendar Center (Top Left)
windowrule = match:class ^(.*CalendarCenter.*)$, float on
windowrule = match:class ^(.*CalendarCenter.*)$, size 380 400
windowrule = match:class ^(.*CalendarCenter.*)$, move 10 48
windowrule = match:class ^(.*CalendarCenter.*)$, animation slide top
windowrule = match:title ^(Calendar Center)$, float on
windowrule = match:title ^(Calendar Center)$, size 380 400
windowrule = match:title ^(Calendar Center)$, move 10 48
windowrule = match:title ^(Calendar Center)$, animation slide top

# Wallpaper Center (Top Right)
windowrule = match:class ^(.*WallpaperCenter.*)$, float on
windowrule = match:class ^(.*WallpaperCenter.*)$, size 560 480
windowrule = match:class ^(.*WallpaperCenter.*)$, move 100%-w-10 48
windowrule = match:class ^(.*WallpaperCenter.*)$, animation slide top

# AnyDesk: themed via GTK (see scripts/anydesk-launch.sh and
# apps/theme/gtk-3.0/gtk.css). Keep a thin border so the top edge still reads
# as a window boundary against the black waybar strip. Blur comes from the
# global decoration.blur block — there is no per-window `blur` rule (that
# field only exists on layerrule, as used for waybar/rofi above).
windowrule = match:class ^(anydesk)$, border_size 2
windowrule = match:class ^(anydesk)$, border_color rgba(ffffffcc) rgba(2a2a2a88)
windowrule = match:class ^(anydesk)$, opacity 0.90 override 0.85 override 1.0 override

# Dolphin: Kvantum PureBlackGlass supplies the window's alpha; keep the
# compositor opacity at 1.0 so it isn't dimmed twice, and let the global
# blur block frost the wallpaper behind the translucent surface.
windowrule = match:class ^(org.kde.dolphin)$, opacity 1.0 1.0

# Kitty: same reasoning. The terminal draws its own glass (background_opacity
# plus the per-pane transparent_background_colors in apps/kitty/kitty.conf),
# so the compositor stays at 1.0 — otherwise the Neovim editor panes get
# dimmed twice and the code stops being readable over a bright wallpaper.
windowrule = match:class ^(kitty)$, opacity 1.0 1.0

# Wi-Fi / Bluetooth live in the quickshell control centre (top-right hot
# corner). The old waybar modules and their rofi dropdowns are gone; the
# scripts/waybar-wifi.sh and waybar-bluetooth.sh helpers are kept but unwired.
# blueman-manager / nm-connection-editor are only opened as the "Advanced"
# fallback; float them so they don't tile. (GTK apps self-position at map time
# and ignore static move rules, so the scripts place them instead when used.)
windowrule = match:class ^(.*[Bb]lueman.*)$, float on
windowrule = match:class ^(.*[Bb]lueman.*)$, animation slide top

windowrule = match:class ^(.*[Nn]m-.*)$, float on
windowrule = match:class ^(.*[Nn]m-.*)$, animation slide top

# Network Center (Top Right)
windowrule = match:class ^(.*[Nn]etwork.*[Cc]enter.*)$, float on
windowrule = match:class ^(.*[Nn]etwork.*[Cc]enter.*)$, size 420 560
windowrule = match:class ^(.*[Nn]etwork.*[Cc]enter.*)$, move 100%-w-10 48
windowrule = match:class ^(.*[Nn]etwork.*[Cc]enter.*)$, animation slide top
windowrule = match:title ^(Network Center)$, float on
windowrule = match:title ^(Network Center)$, size 420 560
windowrule = match:title ^(Network Center)$, move 100%-w-10 48
windowrule = match:title ^(Network Center)$, animation slide top

# Power Center (Top Right)
windowrule = match:class ^(.*PowerCenter.*)$, float on
windowrule = match:class ^(.*PowerCenter.*)$, size 380 280
windowrule = match:class ^(.*PowerCenter.*)$, move 100%-w-10 48
windowrule = match:class ^(.*PowerCenter.*)$, animation slide top
windowrule = match:title ^(Power Center)$, float on
windowrule = match:title ^(Power Center)$, size 380 280
windowrule = match:title ^(Power Center)$, move 100%-w-10 48
windowrule = match:title ^(Power Center)$, animation slide top

# Spotify app: translucent glass — blur (ignore_opacity) frosts the
# wallpaper through the Electron surface. `override` sets absolute opacity
# (not multiplied by decoration active/inactive_opacity). Fullscreen stays solid.
windowrule = match:class ^(spotify)$, opacity 0.80 override 0.70 override 1.0 override

# Spotify Center (Top Left, under the now-playing module)
windowrule = match:class ^(.*SpotifyCenter.*)$, float on
windowrule = match:class ^(.*SpotifyCenter.*)$, size 340 470
windowrule = match:class ^(.*SpotifyCenter.*)$, move 10 48
windowrule = match:class ^(.*SpotifyCenter.*)$, animation slide top
windowrule = match:title ^(Spotify Center)$, float on
windowrule = match:title ^(Spotify Center)$, size 340 470
windowrule = match:title ^(Spotify Center)$, move 10 48
windowrule = match:title ^(Spotify Center)$, animation slide top









# Disable experimental color management to restore full physical screen brightness (prevents SDR clamping to 80 nits)
render {
  cm_enabled = false
}
