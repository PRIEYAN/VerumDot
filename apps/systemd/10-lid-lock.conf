# VerumDot — lid close must NOT sleep/hibernate.
# Hyprland owns lid: lock + dpms off (scripts/lid-close.sh),
# lid open restores the panel (scripts/display-restore.sh) on the lock screen.
#
# Install:
#   sudo cp apps/systemd/10-lid-lock.conf /etc/systemd/logind.conf.d/10-lid-lock.conf
#   sudo rm -f /etc/systemd/logind.conf.d/10-lid-hibernate.conf
#   sudo systemctl restart systemd-logind
#
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
