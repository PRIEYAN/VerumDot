# hypridle — idle management. No suspend, no hibernate: the machine never
# sleeps on its own. Idle just locks and turns the panel off; applications
# keep running in the background. Any key/mouse input wakes the panel back
# up on the lock screen (handled by hyprlock, not hypridle).
#
# Ownership split (do not duplicate a trigger across both sides):
#   - LID CLOSE is owned by Hyprland (scripts/lid-close.sh): lock + dpms off.
#     logind HandleLidSwitch must be `ignore` (apps/systemd/10-lid-lock.conf).
#   - The IDLE timeline below is owned by hypridle.

general {
    # `pidof` guard: a second hyprlock instance steals input from the first
    # and leaves a screen that cannot be unlocked.
    lock_cmd = pidof hyprlock || hyprlock

    # Respect inhibitors. This is what makes waybar's "stay awake" toggle
    # (the idle_inhibitor module) actually work: when it is activated it
    # holds a Wayland idle inhibitor, Hyprland then stops emitting the
    # ext-idle-notify events hypridle listens on, and nothing below can
    # fire — no lock, no dpms off.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 5 min — lock, and that is all. The panel deliberately stays powered so the
# lock screen remains visible; there is no dpms-off listener and no dimming
# step. Both were removed on request: the screen going black behind the lock
# is what made a resumed machine look dead.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 30 min — lock (if not already) and turn the panel off. Nothing sleeps;
# the session and every background app keep running. Any keypress or mouse
# move wakes the panel back on, straight to the lock screen.
listener {
    timeout = 1800
    on-timeout = loginctl lock-session; hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
