# hypridle — idle + sleep management.
#
# Ownership split (do not duplicate a trigger across both sides, that is
# what causes the double-suspend / black-screen-on-resume races):
#   - LID CLOSE is owned by systemd-logind
#     (/etc/systemd/logind.conf.d/10-lid-hibernate.conf). hypr.conf only
#     locks on lid close; it must never call `systemctl suspend` itself.
#   - The IDLE timeline below is owned by hypridle.
#
# NVIDIA: this laptop runs the proprietary driver with
# NVreg_PreserveVideoMemoryAllocations=1, so the GPU's VRAM is saved to
# disk by an nvidia-*.service that hooks the matching systemd sleep unit.
# Every sleep verb used here needs its counterpart service enabled
# (suspend-then-hibernate -> nvidia-suspend-then-hibernate.service) or the
# machine sleeps without saving VRAM and wakes to a dead session.

general {
    # `pidof` guard: a second hyprlock instance steals input from the first
    # and leaves a screen that cannot be unlocked.
    lock_cmd = pidof hyprlock || hyprlock

    # Always sleep behind a lock screen.
    before_sleep_cmd = loginctl lock-session

    # Resume with the panel actually back. This re-declares the monitor as
    # well as powering it on — `dpms on` alone cannot revive an output that
    # was disabled during sleep, which is what leaves a black screen on wake.
    after_sleep_cmd = ~/.config/hypr/scripts/display-restore.sh

    # Respect inhibitors. This is what makes waybar's "stay awake" toggle
    # (the idle_inhibitor module) actually work: when it is activated it
    # holds a Wayland idle inhibitor, Hyprland then stops emitting the
    # ext-idle-notify events hypridle listens on, and nothing below can
    # fire — no lock, no suspend. Flipping either of these to `true`, or
    # adding `ignore_inhibit = true` to a listener, silently defeats that
    # toggle for that path.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 5 min — lock, and that is all. The panel deliberately stays powered so the
# lock screen remains visible; there is no dpms-off listener and no dimming
# step. Both were removed on request: the screen going black behind the lock
# is what made a resumed machine look dead.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 30 min — suspend now; logind's HibernateDelaySec (45min, see
# /etc/systemd/sleep.conf.d/10-hibernate-delay.conf) then flips it to
# hibernate so a forgotten, unplugged laptop saves its session to the
# swapfile instead of draining flat.
listener {
    timeout = 1800
    on-timeout = systemctl suspend-then-hibernate
}
