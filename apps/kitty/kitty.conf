# ─── Fonts ─────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        13.0
disable_ligatures never
modify_font cell_height 110%
text_composition_strategy 1.7 30

# ─── Window / Glass ────────────────────────────────────
window_padding_width   18
window_margin_width    0
single_window_margin_width 0
hide_window_decorations yes
window_border_width    0
confirm_os_window_close 0
remember_window_size   no
initial_window_width   1100
initial_window_height  650

background_opacity        0.55
background_blur           64
dynamic_background_opacity yes
# Dim text (used by TUIs for secondary labels) at 0.55 disappears entirely
# once a wallpaper is showing through the pane behind it.
dim_opacity               0.78

# ─── Glass panes ───────────────────────────────────────
# kitty makes only the *default* background translucent — a cell carrying an
# explicit background colour is drawn solid. The Neovim overlay paints four
# near-black pane colours (apps/nvim/lua/verum/palette.lua); listing them here
# is what turns each one into its own sheet of glass instead of a black
# rectangle sitting on top of the wallpaper.
#
#   #010104  editor       #050509  explorer
#   #08080d  terminal     #0b0b11  tabline / statusline
#
# Denser panes sit further forward. Change a value here and you must change
# the matching one in palette.lua, or that pane goes opaque.
transparent_background_colors #010104@0.60 #050509@0.70 #08080d@0.74 #0b0b11@0.80

# ─── Cursor ────────────────────────────────────────────
cursor_shape           beam
cursor_beam_thickness  1.6
cursor_blink_interval  0.5
cursor_trail           3
cursor_trail_decay     0.1 0.4

# ─── Tab bar ───────────────────────────────────────────
tab_bar_edge           top
tab_bar_style          powerline
tab_powerline_style    slanted
tab_title_template     " {index}  {title} "
active_tab_font_style  bold
inactive_tab_font_style normal

# ─── Scroll / perf ─────────────────────────────────────
scrollback_lines       10000
repaint_delay          8
input_delay            1
sync_to_monitor        yes
enable_audio_bell      no

# ─── URLs ──────────────────────────────────────────────
url_color #8be9fd
url_style curly
detect_urls yes

# ─── Shell ─────────────────────────────────────────────
shell zsh
shell_integration enabled

# ─── Theme (glassy dracula-ish) ────────────────────────
background           #1a1b26
foreground           #c0caf5
cursor               #ff79c6
cursor_text_color    #1a1b26
selection_background #44475a
selection_foreground #f8f8f2

# normal
color0  #21222c
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #f8f8f2

# bright
color8  #6272a4
color9  #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff
