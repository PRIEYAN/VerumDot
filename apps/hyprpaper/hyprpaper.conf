# hyprpaper.conf — the wallpaper that survives a reboot.
#
# Without this file hyprpaper starts, finds no target, and logs
#   "Monitor eDP-1 has no target: no wp will be created"
# — it paints nothing, so Hyprland's own stock wallpaper shows through until
# something pushes an image over IPC. That is why the chosen wallpaper looked
# like it was never saved: the choice *was* stored (~/.local/state/hypr/
# wallpaper), but nothing restored it reliably at session start.
#
# Note the syntax: hyprpaper 0.8 replaced the old flat
#   preload = <img>
#   wallpaper = <monitor>,<img>
# pair with this `wallpaper { }` category. The old keys are silently ignored,
# which is exactly what a config that looks right but does nothing feels like.
#
# `path` is the `current-wallpaper` symlink rather than a real image:
# wallpaper::set (lib/domain/wallpaper.sh) repoints that link on every change,
# so this file never needs editing and the choice is restored before any
# script runs. An extensionless symlink is fine — hyprpaper sniffs content.
wallpaper {
    # Empty monitor = every output, including ones hotplugged later.
    monitor =
    path = /home/prieyan/.config/hypr/current-wallpaper
    fit_mode = cover
}
