# Workspace layout.
#
# 1-9 are persistent: they always exist, so the bar shows a full row of nine
# from login and SUPER+<n> always lands somewhere, even on an empty desktop.
#
# 10 and up are NOT declared here on purpose. Hyprland creates a numbered
# workspace the moment something navigates to it and destroys it again once
# it is empty and unfocused, so overflow workspaces appear only while you are
# actually using them. `workspace, +1` (SUPER+CTRL+Right / SUPER+scroll) and
# the 3-finger swipe are what push past 9 and bring a new one into being.
#
# The hidden workspace is `special:hidden` -- a special workspace with no
# numeric id -- so it never collides with the overflow range.

workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true
