# Minimal Hyprland entry point
# Sources the shared Hyprland config and starts common desktop helpers.

source = ./hypr.conf

# Boot splash: pure black overlay with assets/splash.mp4 centred on it, held
# for one second while the services below come up behind it. The launcher
# enforces that deadline from outside the surface, so a splash that fails to
# play or refuses to exit can never keep the desktop hidden.
# NOT `qs -p ... -n` directly: this surface is a one-shot, not a daemon.
exec-once = ~/.config/hypr/scripts/splash.sh

# Common autostart helpers
# Instantly refresh the battery/charger icon on plug/unplug (pokes waybar).
exec-once = ~/.config/hypr/scripts/battery-watch.sh
exec-once = ~/.config/hypr/scripts/battery-alert.sh
# Wallpaper. wallpaper.sh starts hyprpaper itself and waits for its socket,
# so a bare `exec-once = hyprpaper` here only raced a second instance.
exec-once = ~/.config/hypr/scripts/wallpaper.sh init
# Start the hypridle daemon for locking and sleep management
exec-once = hypridle
# Notification daemon (top-right)
exec-once = mako --config ~/.config/hypr/apps/mako/config
exec-once = nm-applet --indicator
exec-once = blueman-applet
# Waybar, supervised. The old `sh -c "sleep 1 && waybar"` guessed at when the
# compositor would be ready and left nothing watching the process, so a bar
# that lost that race stayed missing for the entire session.
exec-once = ~/.config/hypr/scripts/waybar-start.sh
